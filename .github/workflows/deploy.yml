name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Zyte API key
        if: ${{ secrets.ZYTE_API_KEY != '' }}
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: printf '%s' "$ZYTE_API_KEY" | npx wrangler@4 secret put ZYTE_API_KEY

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
