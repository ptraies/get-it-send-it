name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Wrangler
        run: npm install --no-save wrangler@4

      - name: Set Zyte API key
        if: ${{ secrets.ZYTE_API_KEY != '' }}
        env:
          ZYTE_API_KEY: ${{ secrets.ZYTE_API_KEY }}
        run: |
          printf '%s' "$ZYTE_API_KEY" | npx --no-install wrangler secret put ZYTE_API_KEY --name get-it-send-it

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
